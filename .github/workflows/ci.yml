name: CI

on:
  push:
    branches: [ master, feature/* ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Run type checking
      run: npm run test:type-check
      
    - name: Check code formatting
      run: npm run format:check
      
    - name: Run tests
      run: npm run test:ci
      
    - name: Test with example schemas
      run: |
        npx prisma generate --schema=tests/schemas/basic.prisma
        npx prisma generate --schema=tests/schemas/comprehensive.prisma

    # Every step above passes an explicit --schema, so none of them ever load
    # prisma/schema.prisma, the default the README's `npm run start` uses. That
    # schema was left on Prisma 6 syntax while the fixtures were migrated, and
    # the documented command failed for a full release with CI green.
    - name: Run the documented start command
      run: npm run start

  package-test:
    runs-on: ubuntu-latest
    needs: test

    # Same matrix as `test`. This job used to pin 20.x, which went end of life in
    # April 2026 and is outside the range `test` covers, so the tarball was the
    # one artifact verified on a Node the project does not support. 22 and 24 also
    # differ in the npm major that builds it (10 vs 11), and `npm pack` is npm's.
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      
    - name: Build and package
      run: |
        npm run build
        ./package.sh
        
    # `npm pack --dry-run` reports whatever it finds and exits 0, so on its own
    # it passed against a package/ that contained no lib/ whatsoever. Assert the
    # entry point `bin` names is actually in the tarball before believing it.
    - name: Test package integrity
      run: |
        set -euo pipefail
        cd package
        test -f lib/generator.js
        npm pack --dry-run

    # upload-artifact@v4 rejects a second upload under a name that already exists,
    # so the matrix legs cannot share one.
    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-build-node-${{ matrix.node-version }}
        path: package/
        retention-days: 7
